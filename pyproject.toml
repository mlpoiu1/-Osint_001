[project]
name = "osint-terminal"
version = "0.1.0"
description = "Kali Linux terminal application organizing a personal OSINT tool collection as 500+ plugins, built with Clean Architecture."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "textual>=0.58",
    "rich>=13.7",
    "rapidfuzz>=3.9",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
osint-terminal = "osint_terminal.presentation.app:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["osint_terminal"]

[tool.ruff]
line-length = 100
target-version = "py311"
